0x20",w:10,l:20,fits:"Suitable for larger household contents, vehicles where permitted, boats and business storage.",items:["boxes","bed","couch","table","fridge","washer","bike","inventory"]}],El=[{name:"Grant and Cindy",place:"Airdrie",stars:5,src:"Customer",text:"This is my first year using The Storage Depot to store my motor home. A large facility, well managed and owners are very friendly. I was extremely impressed when I called to use their valet service for pick up of my RV and they said it would be ready and waiting for me and it was."},{name:"Google reviewer",place:"Dec 2024",stars:5,src:"Google",text:"I had my trailer there for 3 years and felt it was safe and taken care of. I was always informed and kept in the loop with emails and could call them anytime. They covered up my trailer during the hail storm this summer and called me to inform me I should come look at it."},{name:"Greg",place:"Calgary",stars:5,src:"Customer",text:"Great location. Easy to access and quickly leave the city in any direction. The asphalt surface is nice because there is no dust. Happy to be here."},{name:"Google reviewer",place:"May 2025",stars:5,src:"Google",text:"I secured a spot for my small travel trailer late in the season and it was plenty good value compared to the big name brand I had used the previous year. Most important was the great communication and very friendly team!"},{name:"Cheryl and Dan",place:"Airdrie",stars:5,src:"Customer",text:"The staff were very friendly and knowledgeable. We felt very comfortable dealing with everyone. There is also a very good range of sizes for all vehicles."},{name:"Google reviewer",place:"Jun 2020",stars:5,src:"Google",text:"My son needed some long term storage for his car while he was out of the country for two months. The location, not far from Calgary airport, was ideal and I was so impressed with the positive and professional communications. The rates were great."},{name:"Google reviewer",place:"May 2023",stars:5,src:"Google",tex
